name: .env
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - scikit-learn=1.3.2
  - matplotlib
  - transformers
  - notebook
  - pytorch-lightning
  - tensorboard
  - opencv
  - evaluate
  - sacrebleu
  - rouge-score
  - accelerate
  - safetensors
  # Torch via pip only — avoids conda solver issues (torchaudio 2.6+ needs py>=3.10)
  # and pip/conda mix that breaks imports. PyPI Linux wheels ship with CUDA.
  # If needed, reinstall for your CUDA tag after env create, e.g. cu128:
  #   pip install --force-reinstall torch==2.8.0 torchvision==0.23.0 torchaudio==2.8.0 \
  #     --index-url https://download.pytorch.org/whl/cu128
  - pip:
    - torch==2.8.0
    - torchvision==0.23.0
    - torchaudio==2.8.0
    - open-clip-torch==2.24.0
    - webdataset
