name: .env
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.9
  - pip
  # Matched torch stack. If you later pip-upgrade torch (e.g. 2.8+cu128),
  # reinstall torchvision/torchaudio with pip from download.pytorch.org/whl/.
  - pytorch=2.6.0
  - torchvision=0.21.0
  - torchaudio=2.6.0
  - pytorch-cuda=12.1
  - scikit-learn=1.3.2
  - open-clip-torch=2.24.0
  - matplotlib
  - transformers
  - notebook
  - pytorch-lightning
  - tensorboard
  - opencv
  - evaluate
  - sacrebleu
  - rouge-score
  - accelerate
  - safetensors
  - pip:
    - webdataset